<style>
/* ---- shared mechanics (inlined into every direction; each direction sets the tokens and adds its own look) ---- */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow:hidden;font-family:var(--font-ui);color:var(--ink);background:var(--paper)}

.lcd-body{flex:1;padding:5px 10px;overflow:hidden;min-height:0}

.pad{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none;user-select:none;min-width:0}

.softs .soft{height:20px;font:600 9px var(--font-mono);letter-spacing:.08em}
.modes{display:flex;flex-wrap:wrap;gap:3px}.mode{font:600 9px var(--font-mono);letter-spacing:.08em;padding:3px 7px}
.transport{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--tgap,5px)}
.tkey{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px;min-width:0}.tkey i{font-style:normal;font-size:13px;line-height:1}.tkey span{font:600 8.5px var(--font-mono);letter-spacing:.1em}
.banks{display:flex;gap:4px;align-items:center}.bkey{font:700 12px var(--font-mono);min-width:30px;height:28px}.bkey.nav{min-width:22px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.key{font:600 12px var(--font-mono);height:28px}.key.ent{font-size:9px;letter-spacing:.08em}
/* knobs, wheel */
[data-knob]{display:grid;justify-items:center;gap:2px;cursor:ns-resize;touch-action:none;user-select:none;outline-offset:4px}
.k-body{position:relative;display:block;width:var(--k,44px);height:var(--k,44px);border-radius:50%;transform:rotate(var(--ang,0deg))}
.k-ind{position:absolute;left:50%;top:4px;width:2px;height:28%;transform:translateX(-50%);background:var(--k-ind,#fff);border-radius:1px}

/* platter */
.plat-svg{display:block;width:100%;height:auto;overflow:visible}
.p-rim{fill:none;stroke:var(--p-ring,var(--ink));stroke-width:.6}.p-tick{stroke:var(--p-ring,var(--ink));stroke-width:.5}.p-tick.big{stroke-width:.9}
.p-arc{fill:none;stroke:var(--acc-o);stroke-width:3.2}.p-dot{fill:var(--acc-o);stroke:var(--paper);stroke-width:1}
.p-disc{fill:var(--vinyl)}.p-groove{fill:none;stroke:var(--groove);stroke-width:.35}.p-label{fill:var(--label)}.p-wedge{fill:var(--label-wedge,rgba(0,0,0,.12))}
.p-lt{font:700 6.2px var(--font-mono);fill:var(--label-ink);letter-spacing:.14em}.p-lt.s{font-size:4.1px;font-weight:600;letter-spacing:.1em}.p-notch{stroke:var(--label-ink);stroke-width:1}.p-hole{fill:var(--paper);stroke:var(--label-ink);stroke-width:.5}
.p-sheen{fill:#fff;opacity:var(--sheen,.07)}.p-armline{stroke:var(--arm,var(--ink));stroke-width:2;stroke-linecap:round}.p-head{fill:var(--arm,var(--ink))}.p-pivot{fill:var(--paper);stroke:var(--arm,var(--ink));stroke-width:1.5}
/* library */
.lib-import{display:flex;gap:4px}.lib-import input{flex:1;min-width:0;font:12px var(--font-mono);padding:6px 7px;background:var(--field-bg,transparent);color:inherit;border:1px solid var(--line);border-radius:0}
.lib-import input::placeholder{color:inherit;opacity:.55}.lib-import button{font:700 11px var(--font-mono);padding:0 9px;letter-spacing:.06em}
.lib-drop{font:10.5px var(--font-mono);opacity:.7;margin:5px 0 8px}
.lib-songs li,.lib-kits li{cursor:pointer;padding:5px 7px;display:block}.lib-songs b,.lib-kits b{display:block;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lib-songs small,.lib-kits small{display:block;font:10px var(--font-mono);opacity:.7}
h4{font:700 10px var(--font-mono);letter-spacing:.16em;text-transform:uppercase}
/* strips, wave */
[data-sections]{display:flex;position:relative;height:20px}.sec{overflow:hidden;white-space:nowrap;font:600 9.5px var(--font-mono);letter-spacing:.1em;padding:3px 6px;cursor:pointer;text-transform:uppercase}
.sec-head{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--acc-o);pointer-events:none}

/* vox */
.vox-host{position:relative;overflow:hidden}.vox-holder{position:absolute;inset:0}.vox-holder canvas{display:block}

/* ---- direction ---- */
:root{

  --lcd-bg:#f6f5ef;--lcd-ink:#0b0b0b;
  --vu-face:#efe3c2;--vu-line:#0b0b0b;--vu-ink:#2b2418;--vu-needle:#0b0b0b;
  --vinyl:#0b0b0b;--groove:rgba(255,255,255,.1);--label:#efe3c2;--label-ink:#0b0b0b;--label-wedge:rgba(255,90,0,.9);--p-ring:#0b0b0b;--arm:#0b0b0b;--sheen:.1;

}
body{background:var(--paper);font-size:12px;
  background-image:linear-gradient(115deg,transparent 0 62%,rgba(184,192,207,.45) 62% 100%),linear-gradient(0deg,#e7e6df,#f4f3ee)}

.wk{background:#fff;color:#000;border:0;bottom:-16px}
.keypad{gap:3px}.key{background:#fff;color:#000;height:30px}.key:active{background:var(--acc-o)}.key.ent{background:var(--acc-b);color:#fff}
.wkz .nv{grid-column:1 / -1}

.transport{--tgap:6px}.tkey{background:#fff;border:3px solid var(--ink);height:58px}.tkey i{font-size:17px}.tkey span{font-family:var(--font-ui);font-weight:400;font-size:8.5px}
.tkey[data-act=rec]{color:var(--acc-o)}.tkey.on{background:var(--acc-o);color:#000;border-color:var(--ink)}.tkey[data-act=rec].on{animation:blink 1s steps(2) infinite}.tkey[data-act=pattern]{background:var(--ink);color:#fff}.tkey[data-act=pattern].on{background:var(--acc-o);color:#000}

.knobs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

<body>
<div class="stage">
  <header class="hd">
    <div class="logo"><b></b>ChopPad</div>
    <div class="tt" style="opacity:.7">Song station · CP-16</div>
    <div class="song"><span data-bind="title"></span> <i data-bind="bpm"></i> BPM · <span data-bind="meter"></span> · BANK <span data-bind="bank"></span></div>

  else if (e.key === "Escape") { S.keybuf = ""; S.field = -1; lcd(); }
});
addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (k in KEYPADS) padEls[KEYPADS[k]]?.classList.remove("held"); });

/* ---------- boot ---------- */
buildAll();
document.documentElement.dataset.reduced = REDUCED ? "1" : "0";
const voxEl = $("[data-vox]"); if (voxEl) await voxInit(voxEl);
if (S.vis.paused) { for (let i = 0; i < 6; i++) advance(0.1); platterUpdate(0.1); refresh(); waveDraw(); videoDraw(); vox?.renderOnce(); }
requestAnimationFrame(tick);
window.CP = { S, hit, vox: () => vox, FPS };

</script>
